"$schema" = 'https://starship.rs/config-schema.json'

# Keep off: with ble.sh, the leading blank line makes the startup redraw
# leave a duplicate prompt behind.
add_newline = false

format = """
[](seg_user)$os$username[](fg:seg_user bg:seg_dir)$directory[](fg:seg_dir bg:seg_git)$git_branch$git_status[](fg:seg_git bg:seg_lang)$c$rust$golang$nodejs$php$java$kotlin$haskell$python$docker_context$conda[](fg:seg_lang bg:seg_time)$time[ ](fg:seg_time)$line_break$character"""

palette = 'nordic'

# Nordic (nordic.nvim): Polar Night segments with soft-white text and
# Aurora/Frost accents on icons.
[palettes.nordic]
text = '#D8DEE9'
seg_user = '#4C566A'
seg_dir = '#434C5E'
seg_git = '#3B4252'
seg_lang = '#2E3440'
seg_time = '#3B4252'
frost = '#88C0D0'
green = '#A3BE8C'
orange = '#D79784'
purple = '#B48EAD'
red = '#BF616A'
yellow = '#EBCB8B'

[os]
disabled = false
style = "bg:seg_user fg:orange"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:seg_user fg:text"
style_root = "bg:seg_user fg:red"
format = '[ $user ]($style)'

[directory]
style = "bg:seg_dir fg:text"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:seg_git"
format = '[[ $symbol](fg:green bg:seg_git)[ $branch ](fg:text bg:seg_git)]($style)'

[git_status]
style = "bg:seg_git"
format = '[[($all_status$ahead_behind )](fg:yellow bg:seg_git)]($style)'

[nodejs]
symbol = ""
style = "bg:seg_lang"
format = '[[ $symbol](fg:frost bg:seg_lang)[( $version) ](fg:text bg:seg_lang)]($style)'

[c]
symbol = ""
style = "bg:seg_lang"
format = '[[ $symbol](fg:frost bg:seg_lang)[( $version) ](fg:text bg:seg_lang)]($style)'

[rust]
symbol = ""
style = "bg:seg_lang"
format = '[[ $symbol](fg:frost bg:seg_lang)[( $version) ](fg:text bg:seg_lang)]($style)'

[golang]
symbol = ""
style = "bg:seg_lang"
format = '[[ $symbol](fg:frost bg:seg_lang)[( $version) ](fg:text bg:seg_lang)]($style)'

[php]
symbol = ""
style = "bg:seg_lang"
format = '[[ $symbol](fg:frost bg:seg_lang)[( $version) ](fg:text bg:seg_lang)]($style)'

[java]
symbol = ""
style = "bg:seg_lang"
format = '[[ $symbol](fg:frost bg:seg_lang)[( $version) ](fg:text bg:seg_lang)]($style)'

[kotlin]
symbol = ""
style = "bg:seg_lang"
format = '[[ $symbol](fg:frost bg:seg_lang)[( $version) ](fg:text bg:seg_lang)]($style)'

[haskell]
symbol = ""
style = "bg:seg_lang"
format = '[[ $symbol](fg:frost bg:seg_lang)[( $version) ](fg:text bg:seg_lang)]($style)'

[python]
symbol = ""
style = "bg:seg_lang"
format = '[[ $symbol](fg:frost bg:seg_lang)[( $version) ](fg:text bg:seg_lang)]($style)'

[docker_context]
symbol = ""
style = "bg:seg_lang"
format = '[[ $symbol](fg:frost bg:seg_lang)[( $context) ](fg:text bg:seg_lang)]($style)'

[conda]
symbol = ""
style = "bg:seg_lang"
format = '[[ $symbol](fg:frost bg:seg_lang)[( $environment) ](fg:text bg:seg_lang)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:seg_time"
format = '[[ ](fg:frost bg:seg_time)[$time ](fg:text bg:seg_time)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[➜](bold fg:green)'
error_symbol = '[✗](bold fg:red)'
vimcmd_symbol = '[](bold fg:green)'
vimcmd_replace_one_symbol = '[](bold fg:purple)'
vimcmd_replace_symbol = '[](bold fg:purple)'
vimcmd_visual_symbol = '[](bold fg:yellow)'
