onboarding = false

[terminal]
default_shell = "/opt/homebrew/bin/bash"
shell_mode = "login"

[theme]
name = "gruvbox"

auto_switch = false
[keys]
prefix = "ctrl+z"
workspace_picker = "prefix+space"
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+shift+d"
close_workspace = "prefix+d"
previous_tab = "prefix+["
next_tab = "prefix+]"
next_agent = "ctrl+n"
previous_agent = "ctrl+shift+n"

# Workspace/navigate mode — spaces only (keep)
navigate_workspace_down = "j"
navigate_workspace_up = "k"

[ui]
redraw_on_focus_gained = false
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"

[ui.sidebar]

[ui.sidebar.agents]

[experimental]
kitty_graphics = true
allow_nested = false
