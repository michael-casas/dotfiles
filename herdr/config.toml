onboarding = false

[terminal]
default_shell = "/opt/homebrew/bin/bash"
shell_mode = "login"

[theme]
name = "gruvbox"

auto_switch = false
[keys]
prefix = "ctrl+space"
workspace_picker = "prefix+w"

# Navigate/workspace mode: spaces only
navigate_workspace_down = "j"
navigate_workspace_up = "k"

# Prefix mode: previous/next pane on h/l (vim)
cycle_pane_previous = "prefix+h"
cycle_pane_next = "prefix+l"

# Do not let defaults steal h/l for directional focus or n/p for tabs
focus_pane_left = ""
focus_pane_right = ""
focus_pane_up = ""
focus_pane_down = ""
previous_tab = ""
next_tab = ""

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"
